<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1a1a">
<meta name="description" content="IN BETWEEN — For everything I felt, lived, and loved.">
<link rel="manifest" href="manifest.json">
<title>IN BETWEEN</title>
<style>
:root{
 --ink:#1c1a1a; --ivory:#f5efe6; --rose:#b98282; --sage:#899580;
 --terra:#b66f5b; --blue:#71879a; --gold:#c6a96b; --muted:#6e665e;
}
*{box-sizing:border-box} body{margin:0;background:var(--ink);color:var(--ivory);font-family:Georgia,serif}
button,input,textarea,select{font:inherit} button{cursor:pointer}
#splash{position:fixed;inset:0;background:#1c1a1a;z-index:50;display:grid;place-items:center;text-align:center;animation:fadeOut 1s 3.1s forwards}
#splash img{width:min(72vw,360px);max-height:62vh;object-fit:contain;filter:drop-shadow(0 10px 35px #000)}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.app{max-width:720px;margin:auto;padding:24px 18px 100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{letter-spacing:.28em;font-size:14px}.menu{border:0;background:none;color:var(--ivory);font-size:24px}
h1{font-size:38px;font-weight:400;margin:10px 0 5px}.sub{color:#d8cdbf;font-style:italic;margin-bottom:24px}
.primary{width:100%;border:1px solid #c6a96b88;background:linear-gradient(135deg,#2b2725,#3a3029);color:var(--ivory);padding:18px;border-radius:20px;letter-spacing:.05em;font-size:16px;box-shadow:0 12px 30px #0005}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.card{border:0;border-radius:20px;padding:22px 16px;text-align:left;min-height:118px;color:#211e1b;box-shadow:0 8px 20px #0003;transition:.2s}
.card:active{transform:scale(.98)} .cream{background:var(--ivory)}.pink{background:#c99a99}.green{background:#aab39e}.blue{background:#91a2b1}.terra{background:#c58470}
.card b{display:block;font-size:18px;margin-bottom:8px}.card span{font-size:13px;opacity:.72}
.section{margin-top:28px}.section h2{font-weight:400;font-size:20px}.today{background:#24211f;border:1px solid #ffffff16;border-radius:22px;padding:20px}
.today small{color:#c6a96b;letter-spacing:.12em}.today p{font-size:20px;line-height:1.5;margin:12px 0 0}
.modal{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:flex-end}.modal.open{display:flex}
.sheet{background:#f5efe6;color:#1c1a1a;width:100%;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px 36px}
.sheet h2{font-weight:400}.close{float:right;border:0;background:none;font-size:24px}
label{display:block;font-size:13px;margin:15px 0 7px;color:#5d554d}
input,textarea,select{width:100%;border:1px solid #d3c7b8;background:#fffaf2;border-radius:13px;padding:12px;color:#1c1a1a}
textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:#1c1a1a;color:#f5efe6}
.memory{margin-top:12px;border-radius:20px;padding:17px;background:#282422;border-left:4px solid var(--gold)}
.memory h3{margin:0 0 6px;font-weight:400}.memory p{margin:8px 0;color:#d8cdbf;line-height:1.45}.memory img{width:100%;border-radius:14px;margin-top:10px;max-height:360px;object-fit:cover}
.empty{color:#a89e94;font-style:italic}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1c1a1af2;backdrop-filter:blur(12px);border-top:1px solid #fff1;display:flex;justify-content:center;z-index:20}
.nav button{flex:1;max-width:180px;background:none;border:0;color:#bfb5aa;padding:13px 4px;font-size:12px}.nav button strong{display:block;font-size:20px;color:#f5efe6}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#f5efe6;color:#1c1a1a;padding:11px 16px;border-radius:999px;display:none;z-index:60}
@media(min-width:700px){.app{padding-top:40px}.modal{align-items:center}.sheet{max-width:650px;margin:auto;border-radius:28px}}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="IN BETWEEN"></div>

<main class="app">
<header><div class="brand">IN BETWEEN</div><button class="menu" onclick="showAbout()">⋯</button></header>
<h1>Welcome back, Shivani. 🤍</h1>
<div class="sub">What are we keeping today?</div>
<button class="primary" onclick="openModal()">＋ Keep a Memory</button>

<div class="grid">
<button class="card cream" onclick="scrollToId('memories')"><b>📸 Memories</b><span>Every little piece worth keeping.</span></button>
<button class="card blue" onclick="scrollToId('memories')"><b>🌙 My Nights</b><span>Thoughts, feelings & quiet moments.</span></button>
<button class="card green" onclick="showToast('People space — coming next')"><b>🫂 People</b><span>The ones who became part of the story.</span></button>
<button class="card terra" onclick="showToast('Places space — coming next')"><b>🌍 Places</b><span>Where your memories happened.</span></button>
<button class="card pink" onclick="showToast('Letters space — coming next')"><b>💌 Letters</b><span>Notes for future-you.</span></button>
<button class="card cream" onclick="showToast('Voice notes are ready in the next build')"><b>🎙️ Voices</b><span>Keep moments in your own voice.</span></button>
</div>

<section class="section">
<div class="today"><small>TODAY, I FELT...</small><p id="feeling">Your first little feeling goes here.</p></div>
</section>

<section class="section" id="memories">
<h2>Your memories ✦</h2>
<div id="memoryList"><div class="empty">Nothing here yet. Start with one small moment.</div></div>
</section>
</main>

<nav class="nav">
<button onclick="window.scrollTo({top:0,behavior:'smooth'})"><strong>⌂</strong>Home</button>
<button onclick="openModal()"><strong>＋</strong>Keep</button>
<button onclick="scrollToId('memories')"><strong>♡</strong>Archive</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<button class="close" onclick="closeModal()">×</button>
<h2>Keep this moment 🤍</h2>
<label>What's this memory called?</label><input id="title" placeholder="First Onam in Punjab">
<div class="row">
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Feeling</label><select id="mood"><option value="cream">Warm</option><option value="pink">Loved</option><option value="green">Peaceful</option><option value="blue">Nostalgic</option><option value="terra">Excited</option></select></div>
</div>
<label>Where?</label><input id="place" placeholder="A place, city, or simply “home”">
<label>What happened?</label><textarea id="story" placeholder="Tell future-you what happened..."></textarea>
<label>What do I want to remember?</label><textarea id="remember" placeholder="The little detail you never want to lose."></textarea>
<label>Add a photo</label><input id="photo" type="file" accept="image/*">
<button class="save" onclick="saveMemory()">♡ Keep this memory</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const KEY='inbetween_memories_v1';
let memories=JSON.parse(localStorage.getItem(KEY)||'[]');
document.getElementById('date').value=new Date().toISOString().slice(0,10);
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function scrollToId(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function saveMemory(){
 const title=document.getElementById('title').value.trim()||'A little moment';
 const file=document.getElementById('photo').files[0];
 const finish=(photo='')=>{
   const m={id:Date.now(),title,date:document.getElementById('date').value,place:document.getElementById('place').value.trim(),
   story:document.getElementById('story').value.trim(),remember:document.getElementById('remember').value.trim(),
   mood:document.getElementById('mood').value,photo};
   memories.unshift(m); localStorage.setItem(KEY,JSON.stringify(memories)); render(); closeModal(); clearForm(); showToast('Kept safely in your little world 🤍');
 };
 if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)} else finish();
}
function clearForm(){['title','place','story','remember'].forEach(id=>document.getElementById(id).value='');document.getElementById('photo').value=''}
function render(){
 const box=document.getElementById('memoryList'); box.innerHTML='';
 if(!memories.length){box.innerHTML='<div class="empty">Nothing here yet. Start with one small moment.</div>';return}
 document.getElementById('feeling').textContent=memories[0].remember||memories[0].story||'A little piece of life worth keeping.';
 memories.forEach(m=>{
   const d=document.createElement('article'); d.className='memory';
   d.innerHTML=`<small>${m.date||''}${m.place?' · '+escapeHtml(m.place):''}</small><h3>${escapeHtml(m.title)}</h3>
   ${m.story?'<p>'+escapeHtml(m.story)+'</p>':''}${m.remember?'<p>♡ '+escapeHtml(m.remember)+'</p>':''}
   ${m.photo?'<img src="'+m.photo+'" alt="Memory photo">':''}`;
   box.appendChild(d);
 })
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function showAbout(){alert('IN BETWEEN\\n\\nFor everything I felt, lived, and loved.\\n\\nYour private little memory space.')}
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
